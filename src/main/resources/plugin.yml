name: ${name}
version: ${version}
main: com.yonn2222.clientsortpaper.ClientSortPaper
api-version: '1.21'
folia-supported: true
softdepend: [floodgate]
authors: [${author}]
description: '${description}'
website: ${website}
commands:
  clientsort:
    description: Manage ClientSortPaper
    usage: /<command> <reload|status>
    aliases: [csp]
  sort:
    description: Sort your inventory or the open container without the ClientSort mod
    usage: /<command> [inventory|container] [name|quantity]
permissions:
  clientsortpaper.use:
    description: Use server accelerated sorting, stack filling and transfers
    default: true
  clientsortpaper.reload:
    description: Reload the configuration
    default: op
  clientsortpaper.status:
    description: Show the ClientSortPaper status
    default: op
  clientsortpaper.*:
    description: All ClientSortPaper permissions
    default: op
    children:
      clientsortpaper.use: true
      clientsortpaper.reload: true
      clientsortpaper.status: true
